services:
  # --- BACKEND ---
  api:
      build:
        context: ./backend
        dockerfile: Dockerfile
      # container_name: ELIMINADO
      # `api` is internal by default in production. Do not publish a host port here to avoid port conflicts on shared/managed hosts.
      command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
      restart: unless-stopped
      environment:
        - APP_ENV=${APP_ENV:-production}
        - APP_KEY=${APP_KEY:-base64:E26wzpvGUYWuJGNUBWqwO9ZVtvw69D6ltkr9KXjnBn8=}
        - DB_CONNECTION=${DB_CONNECTION:-mysql}
        - DB_HOST=${DB_HOST:-saas-db}
        - DB_PORT=${DB_PORT:-3306}
        - DB_DATABASE=${DB_DATABASE:-saas_video}
        - DB_USERNAME=${DB_USERNAME:-root}
        - DB_PASSWORD=${DB_PASSWORD:-secret}
        - REDIS_HOST=${REDIS_HOST:-redis}
      volumes:
        - app_storage:/var/www/html/storage  # Volumen compartido con AI Worker para CAD
      depends_on:
        - db
        - redis
      networks:
        - saas_net
        - dokploy-network
      links:        # <--- Agrega esto para reforzar la conexión DNS
        - redis
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api.rule=Host(`dev.pellit.com.ar`) && PathPrefix(`/api`)"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api.entrypoints=web"
        - "traefik.http.services.${PROJECT_NAME:-saas}-api.loadbalancer.server.port=8000"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api-secure.rule=Host(`dev.pellit.com.ar`) && PathPrefix(`/api`)"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api-secure.entrypoints=websecure"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api-secure.tls=true"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-api-secure.tls.certresolver=letsencrypt"

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # container_name: ELIMINADO
    # NOTE: not publishing `frontend` port in base compose to avoid host port conflicts in multi-tenant hosts (e.g. Dokploy)
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    # -----------------------------------------------------
    # ¡VOLUMES ELIMINADOS! (Esto soluciona el error de node_modules)
    # -----------------------------------------------------
    networks:
      - saas_net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend.rule=Host(`dev.pellit.com.ar`)"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend.entrypoints=web"
      - "traefik.http.services.${PROJECT_NAME:-saas}-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend-secure.rule=Host(`dev.pellit.com.ar`)"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend-secure.tls=true"
      - "traefik.http.routers.${PROJECT_NAME:-saas}-frontend-secure.tls.certresolver=letsencrypt"

  # --- AI WORKER ---
  ai_worker:
      build:
        context: ./ai_engine
        dockerfile: Dockerfile
      # container_name: ELIMINADO
      # CAMBIO: Cambiamos el comando para que corra uvicorn (servidor web)
      command: uvicorn src.worker_manager:app --host 0.0.0.0 --port 5000
      restart: unless-stopped
      environment:
        - REDIS_HOST=redis
        - PYTHONUNBUFFERED=1
        - BACKEND_API_URL=http://api:8000
        - WORKER_API_KEY=${WORKER_API_KEY:-dev_worker_key_123}
        # Model configuration - ONNX is fastest for CPU (2-3x speedup)
        - DETECTION_MODEL=${DETECTION_MODEL:-yolo_fastest}
        - DETECTION_RESOLUTION=${DETECTION_RESOLUTION:-medium}
        - DETECTION_MODEL_PATH=${DETECTION_MODEL_PATH:-}
        # ⚠️ WARNING: Only set to 'true' for testing - Ultralytics has AGPL-3.0 license
        - ENABLE_ULTRALYTICS=${ENABLE_ULTRALYTICS:-false}
        # CAD processing
        - ENABLE_CAD=${ENABLE_CAD:-true}
        # VLM Service URL (microservicio separado)
        - VLM_SERVICE_URL=http://vlm_service:5100
        - ENABLE_VLM=${ENABLE_VLM:-true}
      volumes:
        # Mount models volume (read-write to allow downloads)
        - ./ai_engine/models:/app/models
        - app_storage:/app/storage  # Volumen compartido con Laravel para CAD
      # Worker is internal by default in production - do not publish to avoid host port conflicts
      networks:
        - saas_net
        - dokploy-network
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-ai-worker.rule=Host(`dev.pellit.com.ar`) && PathPrefix(`/worker`)"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-ai-worker.entrypoints=websecure"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-ai-worker.tls=true"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-ai-worker.tls.certresolver=letsencrypt"
        - "traefik.http.middlewares.${PROJECT_NAME:-saas}-strip-worker.stripprefix.prefixes=/worker"
        - "traefik.http.routers.${PROJECT_NAME:-saas}-ai-worker.middlewares=${PROJECT_NAME:-saas}-strip-worker"
        - "traefik.http.services.${PROJECT_NAME:-saas}-ai-worker.loadbalancer.server.port=5000"
      depends_on:
        - redis
        - vlm_service

  # --- VLM SERVICE (Moondream2 Microservice) ---
  vlm_service:
      build:
        context: ./vlm_service
        dockerfile: Dockerfile
      command: uvicorn src.main:app --host 0.0.0.0 --port 5100
      restart: unless-stopped
      environment:
        - REDIS_HOST=redis
        - PYTHONUNBUFFERED=1
        - VLM_MODEL=${VLM_MODEL:-vikhyatk/moondream2}
        - VLM_REVISION=${VLM_REVISION:-2024-08-26}
        - VLM_LAZY_LOAD=${VLM_LAZY_LOAD:-true}
        - VLM_PRELOAD=${VLM_PRELOAD:-false}
      volumes:
        - vlm_cache:/root/.cache/huggingface  # Cache de modelos HuggingFace
      depends_on:
        - redis
      networks:
        - saas_net
      deploy:
        resources:
          limits:
            memory: 6G  # Moondream2 necesita ~4GB RAM

  # --- RUST AI WORKER (High Performance Alternative) ---
  # Uncomment to use Rust worker instead of Python worker
  # Start with: docker compose --profile rust up
  rust_worker:
    build:
      context: ./rust_ai_worker
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/app/models/yolov8n.onnx
      - CAMERA_ID=${CAMERA_ID:-1}
      - USER_ID=${USER_ID:-1}
      - RTSP_URL=${RTSP_URL:-rtsp://media_server:8554/live/camera1}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - TARGET_FPS=${TARGET_FPS:-25}
      - RUST_LOG=info
    volumes:
      - ./ai_engine_go/models:/app/models:ro  # Uses existing ONNX model
    depends_on:
      - redis
    networks:
      - saas_net
    profiles:
      - rust  # Only starts with: docker compose --profile rust up
    deploy:
      resources:
        limits:
          memory: 128M  # 10x less than Python worker (512M)

  # --- INFRAESTRUCTURA (Estos SÍ llevan volúmenes para guardar datos) ---
  redis:
      image: redis:alpine
      restart: unless-stopped
      # container_name: ELIMINADO (Ya lo habíamos quitado, bien)
      networks:
        - saas_net
      # AGREGAR ESTO: Comando para asegurar que escuche en todas las interfaces
      command: redis-server --bind 0.0.0.0
  # --- BASE DE DATOS ---
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saas_video
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      saas_net:
        aliases:
          - saas-db

  label_studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - label_studio_data:/label-studio/data
    networks:
      - saas_net

  # --- EMAIL SERVICE (Opcional, para enviar correos) ---
  mailpit:
      image: axllent/mailpit
      restart: unless-stopped
      ports:
        - "8025:8025" # Interfaz web para ver emails
        - "1025:1025" # Puerto SMTP
      networks:
        - saas_net

networks:
  saas_net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  db_data:
  label_studio_data:
  app_storage:  # Volumen compartido entre Laravel y AI Worker para CAD files
  vlm_cache:    # Cache de modelos HuggingFace para VLM service
