<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Cards</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
        <style>
            :root {
                --background: #2C2C2C;
            }

            body {
                background-color: var(--background);
                display: grid;
                place-items: center;
                height: 100vh;
                padding: 1.5rem;
                font-family: Poppins, sans-serif;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .card {
                display: flex;
                flex-wrap: wrap;
                border-radius: 1.25rem 1.25rem 1rem 1rem;
                background-color: white;
                cursor: pointer;
                overflow: hidden;
                max-width: clamp(38.75rem, 70vw, 51.25rem);
                min-width: 15rem;
                min-height: 16.5rem;
            }

            .card:hover {
                box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            }

            .background {
                flex: 1 1 15rem;
            }

            .background img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .content {
                flex: 3 1 22rem;
                display: flex;
                flex-direction: column;
                justify-content: start;
                padding: 1rem;
            }

            .content>h2 {
                font-size: clamp(1.3rem, 2.5vw, 1.8rem);
                font-weight: 700;
                margin-bottom: clamp(0.35rem, 2vw, 0.55rem);
            }

            .content>p {
                font-size: clamp(1.1rem, 1.75vw, 1.35rem);
                font-weight: 400;
                margin-bottom: 1rem;
                line-height: 1.4rem;
            }

            .social-icons {
                display: flex;
                width: 100%;
                justify-content: end;
                margin-top: auto;
                gap: clamp(0.4rem, 2vw, 0.8rem);
            }

            .social-icons li {
                list-style: none;
            }

            .social-icons li a {
                position: relative;
                display: block;
                display: grid;
                place-items: center;
                font-weight: bold;
                transition: .2s;
            }

            .social-icons li a svg {
                stroke: var(--background);
                width: clamp(1.6rem, 2.3vw, 2rem);
                height: clamp(1.6rem, 2.3vw, 2rem);
                stroke-width: 2px;
            }

            .social-icons li a:hover svg {
                transition: 1.2s;
                transform: rotateY(360deg);
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="card">
                <div class='background'>
                    <img src="assets/profile.jpg" alt="background">
                </div>
                <div class='content'>
                    <h2>Jason Alexander</h2>
                    <p>
                        I'm JavaScript full-stack engineer, love working with <em>React</em> and <em>Node.js</em>.
                    </p>
                    <ul class="social-icons">
                        <li>
                            <a href="#twitter" title="Twitter">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="feather feather-twitter">
                                    <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 
                                            10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5
                                            4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z">
                                    </path>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </body>

</html>
