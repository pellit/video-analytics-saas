# Docker Compose for Go AI Worker (Standalone for Dockploy)
# Usage: docker-compose -f docker-compose.go-worker.yml up -d --build

services:
  # Redis for this worker
  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped

  # Go AI Worker
  ai_worker:
    build:
      context: ./ai_engine_go
      dockerfile: Dockerfile
    command: /app/worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HTTP_PORT=5000
      - MODEL_PATH=/app/models/yolov8n.onnx
      - NUM_WORKERS=${NUM_WORKERS:-4}
      - WORKER_ID=go-worker-1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-worker-go.rule=Host(`worker-dev.pellit.com.ar`)"
      - "traefik.http.routers.ai-worker-go.entrypoints=websecure"
      - "traefik.http.routers.ai-worker-go.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-worker-go.loadbalancer.server.port=5000"
