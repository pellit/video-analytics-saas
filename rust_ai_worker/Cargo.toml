[package]
name = "rust_ai_worker"
version = "0.1.0"
edition = "2021"
authors = ["Video Analytics SaaS Team"]
description = "High-performance AI worker for video analytics using ONNX Runtime"

[dependencies]
# Async Runtime
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "macros", "sync", "signal"] }

# ONNX Runtime for inference
ort = { version = "2.0.0-rc.9", features = ["load-dynamic"] }

# Redis communication
redis = { version = "0.25", features = ["tokio-comp", "aio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# N-dimensional arrays (like numpy)
ndarray = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# OpenCV - commented out until we fix bindings
# opencv = { version = "0.92", default-features = false, features = ["clang-runtime"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
