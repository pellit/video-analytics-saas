[package]
name = "rust_ai_worker"
version = "0.1.0"
edition = "2021"
authors = ["Video Analytics SaaS Team"]
description = "High-performance AI worker for video analytics using ONNX Runtime"

[dependencies]
# Async Runtime
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "macros", "sync"] }

# ONNX Runtime for inference
ort = { version = "2.0.0-rc.9", features = ["load-dynamic"] }

# OpenCV bindings for video processing
opencv = { version = "0.93", features = ["videoio", "imgproc", "core"] }

# Redis communication
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# N-dimensional arrays (like numpy)
ndarray = "0.16"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Image processing utilities
image = "0.25"

# HTTP client for health checks
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
