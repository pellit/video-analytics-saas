services:
  # --- BACKEND ---
  api:
    # MANTENEMOS: El comando de desarrollo (para que escuche en puerto 8000)
    command: php artisan serve --host=0.0.0.0 --port=8000
    
    # MANTENEMOS: Variables de entorno de dev
    environment:
      APP_ENV: local
      APP_DEBUG: true
      CORS_ALLOWED_ORIGINS: '*'
      WORKER_API_KEY: ${WORKER_API_KEY}
      APP_KEY: ${APP_KEY:-}
      # Host/URL variables for local dev (use your LAN IP or 0.0.0.0)
      APP_URL: ${APP_URL:-http://192.168.0.38:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.0.38:5173}
    
    # VOLUMES: Espejar código en desarrollo (hot reload)
    volumes:
      - ./backend:/var/www/html

  # --- FRONTEND ---
  frontend:
    # MANTENEMOS: Vite en modo desarrollo
    command: npm run dev -- --host
    
    # RESTAURAMOS: Los volúmenes de código para desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Expose the backend API URL used by Vite in the browser
      VITE_API_URL: ${VITE_API_URL:-http://192.168.0.38:8000/api}
      # Expose the worker's annotated MJPEG stream URL used by the UI
      VITE_STREAM_URL: ${VITE_STREAM_URL:-http://192.168.0.38:5000/video_feed}

  # --- AI WORKER ---
  ai_worker:
    # RESTAURAMOS: Volúmenes de código
    volumes:
      - ./ai_engine:/app
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_HOST: ${REDIS_HOST:-redis}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000}
      WORKER_API_KEY: ${WORKER_API_KEY}
