services:
  # --- BACKEND ---
  api:
    # Comando de desarrollo
    command: php artisan serve --host=0.0.0.0 --port=8000
    
    # Variables de entorno de desarrollo
    environment:
      APP_ENV: local
      APP_DEBUG: true
      CORS_ALLOWED_ORIGINS: '*'
      WORKER_API_KEY: ${WORKER_API_KEY}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://192.168.0.38:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.0.38:5173}

  # --- FRONTEND ---
  frontend:
    # Vite en modo desarrollo
    command: npm run dev -- --host
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://192.168.0.38:8000/api}
      VITE_STREAM_URL: ${VITE_STREAM_URL:-http://192.168.0.38:5000/video_feed}

  # --- AI WORKER ---
  ai_worker:
    environment:
      PYTHONUNBUFFERED: 1
      REDIS_HOST: ${REDIS_HOST:-redis}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000}
      WORKER_API_KEY: ${WORKER_API_KEY}
      # Model configuration - ONNX is fastest for CPU
      DETECTION_MODEL: ${DETECTION_MODEL:-onnx}
      DETECTION_MODEL_PATH: ${DETECTION_MODEL_PATH:-}
      # ⚠️ Set to 'true' only for testing Ultralytics (AGPL-3.0 license)
      ENABLE_ULTRALYTICS: ${ENABLE_ULTRALYTICS:-false}
    volumes:
      # Mount models volume (read-write to allow downloads)
      - ./ai_engine/models:/app/models
