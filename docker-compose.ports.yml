# docker-compose.ports.yml
# Este archivo SOLO se usa en desarrollo local para exponer puertos
# USO: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ports.yml up -d
# NO usar en Dokploy/producción

services:
  api:
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "5173:5173"

  ai_worker:
    ports:
      - "5000:5000"
