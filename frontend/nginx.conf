server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for Docker (allows dynamic upstream resolution)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy (backend) - use variable to allow nginx to start without api being ready
    location /api {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Worker proxy - strip /worker prefix
    location /worker/ {
        set $worker_upstream http://ai_worker:5000;
        rewrite ^/worker/(.*) /$1 break;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Video feed (MJPEG streaming)
    location /video_feed {
        set $worker_upstream http://ai_worker:5000;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    # Architecture info endpoint
    location /architecture/ {
        set $worker_upstream http://ai_worker:5000;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # VLM endpoints
    location /vlm/ {
        set $worker_upstream http://ai_worker:5000;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Health endpoint
    location /health {
        set $worker_upstream http://ai_worker:5000;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
    }

    # Storage files (satellite images, CAD renders, etc.)
    location /storage/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache storage files
        expires 7d;
        add_header Cache-Control "public";
    }
}
