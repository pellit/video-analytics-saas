# =============================================================
# Docker Compose para AI Worker en Dokploy (x86/amd64)
# =============================================================
#
# Este archivo está diseñado para desplegar el AI Worker
# en servidores estándar x86/amd64 (Dokploy, VPS, etc.)
#
# NOTA: Para Jetson Nano (ARM64), usa docker-compose.jetson.yml
#       directamente en el dispositivo Jetson.
#
# USO EN DOKPLOY:
# ---------------
# Seleccionar este archivo: docker-compose.dokploy-worker.yml
#
# =============================================================

services:
  # --- AI INFERENCE WORKER ---
  ai_worker:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    image: video-analytics-ai-worker:latest
    container_name: ai_worker
    
    command: python -u src/worker_manager.py
    
    environment:
      # Redis connection (configurar en Dokploy)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Configuración del worker
      - PYTHONUNBUFFERED=1
      - DEVICE_NAME=${DEVICE_NAME:-dokploy-worker}
      
      # Modelo de detección
      - DETECTION_MODEL=${DETECTION_MODEL:-nanodet}
      - DETECTION_RESOLUTION=${DETECTION_RESOLUTION:-medium}
      
      # CPU mode (sin GPU por defecto en servidores estándar)
      - ENABLE_CUDA=${ENABLE_CUDA:-false}
      - USE_ONNX=${USE_ONNX:-true}
      
      # Backend API URL (para reportar resultados)
      - BACKEND_URL=${BACKEND_URL:-}
      
    volumes:
      # Modelos persistentes
      - ai_models:/app/models
      
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
    
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  ai_models:
    driver: local

# =============================================================
# VARIABLES DE ENTORNO REQUERIDAS EN DOKPLOY:
# =============================================================
#
# REDIS_HOST       - Host de Redis (ej: redis.miservidor.com)
# REDIS_PORT       - Puerto de Redis (default: 6379)
# REDIS_PASSWORD   - Password de Redis (si aplica)
# BACKEND_URL      - URL del backend Laravel
#
# OPCIONALES:
# DETECTION_MODEL  - Modelo a usar (default: nanodet)
# ENABLE_CUDA      - Habilitar GPU (default: false)
#
# =============================================================
