# Docker Compose para Dockploy - Go AI Worker
# Despliega como servicio independiente en Dockploy

services:
  ai_worker_go:
    build:
      context: ./ai_engine_go
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HTTP_PORT=5000
      - MODEL_PATH=/app/models/yolov8n.onnx
      - NUM_WORKERS=${NUM_WORKERS:-4}
      - WORKER_ID=go-worker-1
    volumes:
      - ai_models:/app/models
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-worker-go.rule=Host(`worker-dev.pellit.com.ar`)"
      - "traefik.http.routers.ai-worker-go.entrypoints=websecure"
      - "traefik.http.routers.ai-worker-go.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-worker-go.loadbalancer.server.port=5000"

volumes:
  ai_models:
