# Docker Compose para Dockploy - Go AI Worker (Standalone)
# Despliega como servicio independiente en Dockploy

services:
  # Redis for this worker
  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped

  ai_worker_go:
    build:
      context: ./ai_engine_go
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HTTP_PORT=5000
      - MODEL_PATH=/app/models/yolov8n.onnx
      - NUM_WORKERS=${NUM_WORKERS:-4}
      - WORKER_ID=go-worker-1
      # Python worker URL for VLM/AI analysis (proxied requests)
      - PYTHON_WORKER_URL=${PYTHON_WORKER_URL:-http://saas_ai_worker:5000}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.go-worker-rtsp.rule=Host(`worker-go-dev.pellit.com.ar`)"
      - "traefik.http.routers.go-worker-rtsp.entrypoints=websecure"
      - "traefik.http.routers.go-worker-rtsp.tls.certresolver=letsencrypt"
      - "traefik.http.services.go-worker-rtsp.loadbalancer.server.port=5000"

networks:
  default:
  dokploy-network:
    external: true
