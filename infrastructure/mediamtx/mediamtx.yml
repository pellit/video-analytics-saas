# MediaMTX Configuration
# ======================
# Optimizado para Video Analytics SaaS
# Documentación: https://github.com/bluenviron/mediamtx

###############################################
# General parameters
###############################################

# Logging level (debug, info, warn, error)
logLevel: info
logDestinations: [stdout]

# Timeout for read operations
readTimeout: 10s
# Timeout for write operations
writeTimeout: 10s
# Timeout for reading data from source
readBufferCount: 512
# UDP packet max size
udpMaxPayloadSize: 1472

###############################################
# RTSP server
###############################################

rtsp: yes
protocols: [tcp]
encryption: "no"
rtspAddress: :8554

###############################################
# RTMP server (para OBS/streaming externo)
###############################################

rtmp: yes
rtmpAddress: :1935

###############################################
# HLS server (para móviles)
###############################################

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsAllowOrigin: '*'

###############################################
# WebRTC server (baja latencia)
###############################################

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcICEServers2: []
webrtcAllowOrigin: '*'

###############################################
# API server
###############################################

api: yes
apiAddress: :9997

###############################################
# Recording
###############################################

# Configurado via variables de entorno en docker-compose
# record: no
# recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S.mp4
# recordFormat: mp4

###############################################
# Metrics (Prometheus)
###############################################

metrics: yes
metricsAddress: :9998

###############################################
# Path defaults - Aplicado a todos los paths
###############################################

pathDefaults:
  # Source configuration
  source: publisher
  sourceOnDemand: no
  
  # Allow anyone to publish (el worker autenticará internamente)
  publishUser:
  publishPass:
  publishIPs: []
  
  # Allow anyone to read
  readUser:
  readPass:
  readIPs: []
  
  # Maximum readers per path
  maxReaders: 100
  
  # Recording (heredado de variables de entorno)
  record: no

###############################################
# Paths - Streams específicos
###############################################

paths:
  # Catch-all: acepta cualquier path dinámicamente
  # Los publishers pueden crear paths como /live/camera_1, /live/camera_2, etc.
  all:
    source: publisher
    maxReaders: 50
    
    # Habilitar grabación si es necesario
    # record: yes
    # recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
