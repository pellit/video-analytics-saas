# Nginx Configuration for MediaMTX Architecture
# ==============================================

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:80;
}

upstream ai_worker {
    server ai_worker:5000;
}

upstream mediamtx_webrtc {
    server media_server:8889;
}

upstream mediamtx_hls {
    server media_server:8888;
}

upstream mediamtx_api {
    server media_server:9997;
}

server {
    listen 80;
    server_name _;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Frontend (Vue.js)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Laravel API
    location /api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout for long operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # AI Worker API (MJPEG fallback + endpoints)
    location /worker/ {
        rewrite ^/worker/(.*) /$1 break;
        proxy_pass http://ai_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
    
    # MJPEG Fallback stream
    location /video_feed {
        proxy_pass http://ai_worker/video_feed;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        
        # Disable timeouts for streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # MediaMTX WebRTC (for desktop browsers)
    location /webrtc/ {
        proxy_pass http://mediamtx_webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # WebRTC needs these
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # MediaMTX HLS (for mobile browsers)
    location /hls/ {
        proxy_pass http://mediamtx_hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # CORS for HLS.js
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        
        # Caching for HLS segments
        proxy_cache_valid 200 1s;
    }
    
    # MediaMTX API (for health checks)
    location /mediamtx-api/ {
        proxy_pass http://mediamtx_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # WebSocket for real-time events (Laravel Reverb)
    location /app {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
