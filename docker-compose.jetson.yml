version: "2.3"

services:
  inference_api:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile.jetson
    image: video-analytics-inference:jetson
    container_name: jetson_inference
    restart: always

    command: bash -lc "[ -x /app/script_generate_engine/12_generate_engines_if_missing.sh ] && /app/script_generate_engine/12_generate_engines_if_missing.sh; python3.11 -m uvicorn src.inference_api:app --host 0.0.0.0 --port 5050 --workers 1"

    environment:
      - DEVICE_NAME=jetson-nano
      - PYTHONUNBUFFERED=1
      - ENABLE_CUDA=true
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - JETSON_DATA_DIR_OVERRIDE=/usr/local/bin
      # Forzamos las variables aquí también por seguridad
      - YOLO_SIZE=640
      - CONFIDENCE_THRESHOLD=0.3
      - NMS_THRESHOLD=0.4
      - MODELS_DIR=/app/ai_engine/models
      # 📂 NFS Configuration
      - NFS_MEDIA_ROOT=/home/pta/pta-app/media 

    ports:
      - "5050:5050"

    volumes:
      # -----------------------------------------------------------
      # 🔥 SOLUCIÓN DEFINITIVA: 
      # Mapeamos tu carpeta local "onnx" (donde están los modelos 416 buenos)
      # directamente a donde el código busca los modelos.
      # Esto SOBRESCRIBE cualquier cosa que el Dockerfile haya intentado descargar.
      # -----------------------------------------------------------
      - ./ai_engine/onnx:/app/ai_engine/models

      # 📂 NFS Media Folder (acceso completo al servidor principal)
      - /home/pta/pta-app/media:/home/pta/pta-app/media

      # Volúmenes existentes (mantener)
      - jetson_tensorrt_cache:/root/.cache/tensorrt
      - /tmp/argus_socket:/tmp/argus_socket
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}:/app/data/networks:ro
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}:/usr/local/bin/networks
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}/models.json:/jetson-inference/data/networks/models.json
      - ./ai_engine/src:/app/src

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jetson_tensorrt_cache:
  # jetson_models:  <-- YA NO LO NECESITAS, el bind mount ./ai_engine/onnx es mejor.
