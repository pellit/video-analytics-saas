# =============================================================
# Docker Compose para Jetson Nano (Solo Inferencia AI)
# =============================================================
# Compatible con docker-compose v1.x (Jetson Nano)
#
# USO:
#   docker-compose -f docker-compose.jetson.yml up -d --build
#
# =============================================================

version: "2.2"

services:
  inference_api:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile.jetson
    image: video-analytics-inference:jetson
    container_name: jetson_inference
    
    runtime: nvidia
    
    command: uvicorn src.inference_api:app --host 0.0.0.0 --port 5050 --workers 1
    
    environment:
      - DEVICE_NAME=jetson-nano
      - PYTHONUNBUFFERED=1
      - DETECTION_MODEL=yolo_fastest
      - DETECTION_RESOLUTION=medium
      - ENABLE_CUDA=true
      - ENABLE_TENSORRT=false
      - CUDA_VISIBLE_DEVICES=0
      - MALLOC_TRIM_THRESHOLD_=65536
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
      
    ports:
      - "5050:5050"
    
    volumes:
      - jetson_models:/app/models
      - jetson_tensorrt_cache:/root/.cache/tensorrt
      
    mem_limit: 3g
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jetson_tensorrt_cache:
    driver: local
  jetson_models:
    driver: local

