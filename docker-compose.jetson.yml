version: "2.3"

services:
  inference_api:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile.jetson
    image: video-analytics-inference:jetson
    container_name: jetson_inference
    restart: always

    command: >
      bash -lc '
        set -e
        echo "YOLO_SIZE=${YOLO_SIZE:-320}"
        echo "MODELS_DIR=${MODELS_DIR:-/app/models}"
        mkdir -p /app/models

        if [ -d /app/onnx ]; then
          echo "ONNX disponibles en /app/onnx:"
          ls -1 /app/onnx/*.onnx 2>/dev/null || true
        else
          echo "⚠️ No existe /app/onnx dentro del contenedor"
        fi

        if [ -z "$(ls -A /app/models 2>/dev/null)" ] && [ -d /app/onnx ]; then
          echo "📦 /app/models vacío → copiando ONNX desde /app/onnx"
          cp /app/onnx/*.onnx /app/models/ 2>/dev/null || true
        fi

        echo "Modelos en /app/models:"
        ls -lh /app/models | head -n 200

        exec python3.11 -m uvicorn src.inference_api:app --host 0.0.0.0 --port 5050 --workers 1
      '

    environment:
      - DEVICE_NAME=jetson-nano
      - PYTHONUNBUFFERED=1
      - ENABLE_CUDA=true
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - JETSON_DATA_DIR_OVERRIDE=/usr/local/bin
      - YOLO_SIZE=320
      - MODELS_DIR=/app/models

    ports:
      - "5050:5050"

    volumes:
      - jetson_models:/app/models
      - jetson_tensorrt_cache:/root/.cache/tensorrt
      - /tmp/argus_socket:/tmp/argus_socket
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}:/app/data/networks:ro
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}:/usr/local/bin/networks
      - ${JETSON_HOST_NETWORKS_DIR:-./data/networks}/models.json:/jetson-inference/data/networks/models.json
      - ./ai_engine/src:/app/src

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jetson_tensorrt_cache:
  jetson_models:
