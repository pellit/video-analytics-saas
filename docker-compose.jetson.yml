version: "3.8"

services:
  inference_api:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile.jetson
    image: video-analytics-inference:jetson
    container_name: jetson_inference
    # IMPORTANTE: Esto asegura que arranque solo al reiniciar la Jetson
    restart: always 
    
    command: uvicorn src.inference_api:app --host 0.0.0.0 --port 5050 --workers 1
    
    environment:
      - DEVICE_NAME=jetson-nano
      - PYTHONUNBUFFERED=1
      - DETECTION_MODEL=yolo_fastest
      - ACTIONNET_MODEL=resnet18
      - DEPTHNET_MODEL=resnet18
      - ENABLE_CUDA=true
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "5050:5050"
    
    volumes:
      - jetson_models:/app/models
      - jetson_tensorrt_cache:/root/.cache/tensorrt
      - /tmp/argus_socket:/tmp/argus_socket
      
    mem_limit: 3g
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jetson_tensorrt_cache:
  jetson_models:
