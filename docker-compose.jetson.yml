version: "2.3"

services:
  inference_api:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile.jetson
    image: video-analytics-inference:jetson
    container_name: jetson_inference
    # Habilitar el Runtime de NVIDIA explícitamente es vital en JetPack 4.6
    runtime: nvidia 
    
    command: uvicorn src.inference_api:app --host 0.0.0.0 --port 5050 --workers 1
    
    environment:
      - DEVICE_NAME=jetson-nano
      - PYTHONUNBUFFERED=1
      # ... (resto de tus variables igual)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      
    ports:
      - "5050:5050"
    
    volumes:
      - jetson_models:/app/models
      - jetson_tensorrt_cache:/root/.cache/tensorrt
      # Agregamos acceso al socket de docker y video para debugging si fuera necesario
      - /tmp/argus_socket:/tmp/argus_socket
      
    mem_limit: 3g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jetson_tensorrt_cache:
  jetson_models: